<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Simple live sports events viewer powered by an automatically updated JSON feed.">
<title>Live Events</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#102238;--text:#f7fbff;--muted:#9bb0c7;--line:#1c3550;--accent:#35c6ff;--live:#ff4d67}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#102846 0,#07111f 45%,#050b13 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}header{padding:44px 0 28px;text-align:center}.brand{display:inline-flex;align-items:center;gap:12px;font-weight:900;font-size:clamp(28px,5vw,46px);letter-spacing:-1.5px}.brand-mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#35c6ff,#6d5cff);display:grid;place-items:center;box-shadow:0 12px 30px #35c6ff33}.sub{margin:10px auto 0;color:var(--muted);max-width:650px;line-height:1.6}.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:14px 0 26px;padding:14px 16px;border:1px solid var(--line);background:#0d1b2dbc;border-radius:18px;backdrop-filter:blur(12px)}.count{color:var(--muted);font-size:14px}.refresh{border:1px solid #2b4968;background:#10243a;color:#eaf6ff;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer}.refresh:hover{border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:55px}.card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 18px 45px #0004}.cover{height:190px;background:#091522;position:relative}.cover img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:14px;left:14px;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.7px;background:#1b3046;border:1px solid #31516f}.badge.live{background:#4a1722;border-color:#8e3042;color:#ffdce2}.body{padding:18px}.category{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#77a0c3;font-weight:800}.title{font-size:19px;font-weight:850;line-height:1.3;margin:8px 0 13px}.teams{display:flex;gap:8px;flex-wrap:wrap}.team{padding:7px 10px;border-radius:10px;background:#0a1726;border:1px solid #203a54;color:#d9e9f7;font-size:13px}.meta{margin-top:15px;color:var(--muted);font-size:12px;line-height:1.6}.watch{display:block;width:100%;margin-top:16px;border:0;border-radius:12px;padding:11px 13px;background:linear-gradient(135deg,#35c6ff,#6d5cff);color:white;font-weight:900;cursor:pointer}.watch:disabled{opacity:.45;cursor:not-allowed}.state{grid-column:1/-1;text-align:center;padding:55px 20px;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}footer{padding:22px 0 42px;text-align:center;color:#70869e;font-size:12px;border-top:1px solid #1c3550a6}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.player{width:min(1000px,100%);background:#081321;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 90px #0009}.player-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.player-title{font-weight:800}.close{background:transparent;border:1px solid var(--line);color:white;border-radius:10px;padding:7px 11px;cursor:pointer}.video-wrap{background:#000;aspect-ratio:16/9;display:grid;place-items:center}.video-wrap video{width:100%;height:100%;display:block}.player-status{padding:12px 16px;color:var(--muted);font-size:12px}.spinner{width:30px;height:30px;border:3px solid #ffffff33;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.wrap{width:min(100% - 22px,1180px)}header{padding-top:32px}.grid{grid-template-columns:1fr}.cover{height:205px}.bar{align-items:flex-start}}
</style>
</head>
<body>
<main class="wrap"><header><div class="brand"><span class="brand-mark">◉</span><span>LIVE EVENTS</span></div><p class="sub">Simple live sports listings with automatically updated events and one-click playback.</p></header><div class="bar"><div class="count" id="count">Loading events…</div><button class="refresh" id="refresh">↻ Refresh</button></div><section class="grid" id="events" aria-live="polite"><div class="state">Loading the latest events…</div></section></main>
<footer>Events are refreshed automatically from the configured feed.</footer>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Live player"><div class="player"><div class="player-head"><div class="player-title" id="playerTitle">Live Event</div><button class="close" id="close">Close</button></div><div class="video-wrap"><video id="video" controls playsinline></video><div class="spinner" id="spinner" hidden></div></div><div class="player-status" id="playerStatus">Preparing stream…</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const DATA_URL='https://raw.githubusercontent.com/drmlive/fancode-live-events/main/fancode.json';const REFRESH_MS=60000;const FALLBACK='https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg';const eventsEl=document.getElementById('events'),countEl=document.getElementById('count'),refreshEl=document.getElementById('refresh'),modal=document.getElementById('modal'),video=document.getElementById('video'),spinner=document.getElementById('spinner'),statusEl=document.getElementById('playerStatus'),playerTitle=document.getElementById('playerTitle');let hls=null;
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function proxy(u){return '/api/proxy?u='+encodeURIComponent(u)}
function getStream(m){return m.dai_url||m.adfree_url||''}
function render(matches){if(!matches.length){eventsEl.innerHTML='<div class="state">No events are available right now.</div>';countEl.textContent='0 events';return}const sorted=[...matches].sort((a,b)=>(String(a.status).toUpperCase()==='LIVE'?0:1)-(String(b.status).toUpperCase()==='LIVE'?0:1));eventsEl.innerHTML=sorted.map((m,i)=>{const live=String(m.status||'').toUpperCase()==='LIVE',stream=getStream(m);return `<article class="card"><div class="cover"><img src="${esc(m.src||FALLBACK)}" alt="${esc(m.match_name||m.title||'Live Event')}" loading="lazy" onerror="this.src='${FALLBACK}'"><span class="badge ${live?'live':''}">${live?'● LIVE':'UPCOMING'}</span></div><div class="body"><div class="category">${esc(m.event_category||'Sports')}</div><div class="title">${esc(m.match_name||m.title||'Live Event')}</div><div class="teams">${m.team_1?`<span class="team">${esc(m.team_1)}</span>`:''}${m.team_2?`<span class="team">${esc(m.team_2)}</span>`:''}</div><div class="meta">${esc(m.event_name||'Event')}<br>${esc(m.startTime||'Time unavailable')}</div><button class="watch" ${stream?'':'disabled'} data-index="${i}">${stream?(live?'▶ Watch Live':'▶ Open Stream'):'Stream unavailable'}</button></div></article>`}).join('');countEl.textContent=`${matches.length} event${matches.length===1?'':'s'} · ${sorted.filter(m=>String(m.status||'').toUpperCase()==='LIVE').length} live`;eventsEl.querySelectorAll('.watch').forEach(btn=>btn.addEventListener('click',()=>openPlayer(sorted[Number(btn.dataset.index)])))}
async function load(){refreshEl.disabled=true;refreshEl.textContent='Refreshing…';try{const r=await fetch(DATA_URL+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();render(Array.isArray(data.matches)?data.matches:[])}catch(e){console.error(e);eventsEl.innerHTML='<div class="state">Could not load the latest feed. Please try again.</div>';countEl.textContent='Feed unavailable'}finally{refreshEl.disabled=false;refreshEl.textContent='↻ Refresh'}}
function openPlayer(m){const raw=getStream(m);if(!raw)return;modal.classList.add('open');playerTitle.textContent=m.match_name||m.title||'Live Event';statusEl.textContent='Connecting to live stream…';spinner.hidden=false;video.pause();video.removeAttribute('src');if(hls){hls.destroy();hls=null}const url=proxy(raw);if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play().catch(()=>{});spinner.hidden=true;statusEl.textContent='Live stream';return}if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{spinner.hidden=true;statusEl.textContent='Live stream';video.play().catch(()=>{})});hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){spinner.hidden=true;statusEl.textContent='Unable to play this stream. Try refreshing the feed.';console.error(d)}})}else{spinner.hidden=true;statusEl.textContent='This browser does not support HLS playback.'}}
function closePlayer(){modal.classList.remove('open');video.pause();video.removeAttribute('src');if(hls){hls.destroy();hls=null}}refreshEl.addEventListener('click',load);document.getElementById('close').addEventListener('click',closePlayer);modal.addEventListener('click',e=>{if(e.target===modal)closePlayer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayer()});load();setInterval(load,REFRESH_MS);
</script></body></html>
