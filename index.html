<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple, automatically refreshed live sports events dashboard powered by a public JSON feed." />
  <title>Live Events</title>
  <style>
    :root{--bg:#07111f;--panel:#0d1b2d;--panel2:#102238;--text:#f7fbff;--muted:#9bb0c7;--line:#1c3550;--accent:#35c6ff;--live:#ff4d67;--shadow:0 18px 45px rgba(0,0,0,.25)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#102846 0,#07111f 45%,#050b13 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
    a{color:inherit}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}
    header{padding:48px 0 30px;text-align:center}.brand{display:inline-flex;align-items:center;gap:12px;font-weight:900;font-size:clamp(28px,5vw,46px);letter-spacing:-1.5px}.brand-mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#35c6ff,#6d5cff);display:grid;place-items:center;box-shadow:0 12px 30px rgba(53,198,255,.22)}
    .sub{margin:10px auto 0;color:var(--muted);max-width:650px;line-height:1.6}.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:14px 0 26px;padding:14px 16px;border:1px solid var(--line);background:rgba(13,27,45,.72);border-radius:18px;backdrop-filter:blur(12px)}
    .count{color:var(--muted);font-size:14px}.refresh{border:1px solid #2b4968;background:#10243a;color:#eaf6ff;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer}.refresh:hover{border-color:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:55px}.card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:var(--shadow)}.cover{height:190px;background:#091522;position:relative}.cover img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:14px;left:14px;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.7px;background:#1b3046;border:1px solid #31516f}.badge.live{background:#4a1722;border-color:#8e3042;color:#ffdce2}.body{padding:18px}.category{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#77a0c3;font-weight:800}.title{font-size:19px;font-weight:850;line-height:1.3;margin:8px 0 13px}.teams{display:flex;gap:8px;flex-wrap:wrap}.team{padding:7px 10px;border-radius:10px;background:#0a1726;border:1px solid #203a54;color:#d9e9f7;font-size:13px}.meta{margin-top:15px;color:var(--muted);font-size:12px;line-height:1.6}.source{display:inline-block;margin-top:16px;text-decoration:none;color:#8ddfff;font-size:12px;font-weight:800}.source:hover{text-decoration:underline}.state{grid-column:1/-1;text-align:center;padding:55px 20px;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}footer{padding:22px 0 42px;text-align:center;color:#70869e;font-size:12px;border-top:1px solid rgba(28,53,80,.65)}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}} @media(max-width:620px){.wrap{width:min(100% - 22px,1180px)}header{padding-top:32px}.grid{grid-template-columns:1fr}.cover{height:205px}.bar{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand"><span class="brand-mark">◉</span><span>LIVE EVENTS</span></div>
      <p class="sub">A lightweight sports-events dashboard that automatically reads the latest match information from the configured public JSON feed.</p>
    </header>
    <div class="bar"><div class="count" id="count">Loading events…</div><button class="refresh" id="refresh">↻ Refresh</button></div>
    <section class="grid" id="events" aria-live="polite"><div class="state">Loading the latest events…</div></section>
  </main>
  <footer>Data refreshes automatically. This frontend does not store a local copy of the feed.</footer>
  <script>
    const DATA_URL = 'https://raw.githubusercontent.com/drmlive/fancode-live-events/main/fancode.json';
    const REFRESH_MS = 60_000;
    const fallbackImage = 'https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg';
    const eventsEl = document.getElementById('events');
    const countEl = document.getElementById('count');
    const refreshEl = document.getElementById('refresh');

    const esc = (value='') => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

    function render(matches){
      if(!matches.length){eventsEl.innerHTML='<div class="state">No events are available in the feed right now.</div>';countEl.textContent='0 events';return;}
      const sorted=[...matches].sort((a,b)=> (a.status==='LIVE'?0:1)-(b.status==='LIVE'?0:1));
      eventsEl.innerHTML=sorted.map(m=>{
        const live=String(m.status||'').toUpperCase()==='LIVE';
        const image=esc(m.src||fallbackImage);
        const title=esc(m.match_name||m.title||'Live Event');
        const category=esc(m.event_category||'Sports');
        const event=esc(m.event_name||m.title||'Event');
        const t1=esc(m.team_1||''); const t2=esc(m.team_2||'');
        const time=esc(m.startTime||'Time unavailable');
        return `<article class="card"><div class="cover"><img src="${image}" alt="${title}" loading="lazy" onerror="this.src='${fallbackImage}'">${live?'<span class="badge live">● LIVE</span>':'<span class="badge">UPCOMING</span>'}</div><div class="body"><div class="category">${category}</div><div class="title">${title}</div><div class="teams">${t1?`<span class="team">${t1}</span>`:''}${t2?`<span class="team">${t2}</span>`:''}</div><div class="meta">${event}<br>${time}</div><a class="source" href="https://github.com/drmlive/fancode-live-events/blob/main/fancode.json" target="_blank" rel="noopener noreferrer">View feed record ↗</a></div></article>`;
      }).join('');
      countEl.textContent=`${matches.length} event${matches.length===1?'':'s'} · ${sorted.filter(m=>String(m.status||'').toUpperCase()==='LIVE').length} live`;
    }

    async function load(){
      refreshEl.disabled=true; refreshEl.textContent='Refreshing…';
      try{
        const url=`${DATA_URL}?_=${Date.now()}`;
        const res=await fetch(url,{cache:'no-store'});
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data=await res.json(); render(Array.isArray(data.matches)?data.matches:[]);
      }catch(err){
        console.error(err);
        eventsEl.innerHTML='<div class="state">Could not load the latest feed. Please try again shortly.</div>';
        countEl.textContent='Feed unavailable';
      }finally{refreshEl.disabled=false;refreshEl.textContent='↻ Refresh';}
    }
    refreshEl.addEventListener('click',load); load(); setInterval(load,REFRESH_MS);
  </script>
</body>
</html>
