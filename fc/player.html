<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SHAKA PLAYER</title>
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style type="text/css">
      body {
        position:absolute; margin: 0; padding: 0px;
        background-color: #000000; color: #fff;
        font-family: Arial, sans-serif; display: flex;
        justify-content: center; align-items: flex-start;
        height:100%; width:100%; overflow: hidden;
      }
      .video-container {
        position: absolute; width: 100%; height:100%;
        background-color: #000; overflow: hidden;
      }
      .shaka-video-container { position: absolute; width: 100%; height:100%; }
      video { width: 100%; height: 100%; background-color: #000; }

      /* YouTube Theme CSS */
      .youtube-theme .shaka-controls-button-panel { height: 60px; padding: 0 10px; }
      .youtube-theme .shaka-seek-bar-container input[type=range]::-webkit-slider-thumb { background: #FF0000; }
      
      /* Custom Seek Bar Colors */
      .youtube-theme .shaka-seek-bar { background: rgba(255,255,255,.2) !important; }
      .youtube-theme .shaka-buffered-range { background: rgba(255,255,255,.4) !important; }
      .youtube-theme .shaka-played-range { background: rgb(255,0,0) !important; }

      /* Telegram Popup Style */
      .telegram-popup {
          position: fixed; top: 50%; left: 50%;
          transform: translate(-50%, -50%) scale(0.95);
          background: rgba(255, 255, 255, 0.95);
          backdrop-filter: blur(20px); border-radius: 20px;
          padding: 2.5rem 2rem; z-index: 10000;
          text-align: center; width: 90%; max-width: 400px;
          display: none; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
      }
      .telegram-popup h2 { color: #1e293b; margin-bottom: 0.5rem; }
      .telegram-popup p { color: #64748b; margin-bottom: 1.5rem; }
      .popup-button {
          width: 100%; padding: 1rem; margin-top: 0.75rem;
          border-radius: 12px; cursor: pointer; font-weight: 600;
          text-decoration: none; display: inline-block; border: none;
      }
      .join-btn { background: #2AABEE; color: white; }
      .joined-btn { background: transparent; color: #64748b; border: 1px solid rgba(0,0,0,0.1); }
  </style>
</head>
<body class="youtube-theme">

<div class="video-container">
  <div class="shaka-video-container" data-shaka-player>
    <video id="video" autoplay muted playsinline preload="auto"></video>
  </div>
</div>

<div id="telegramPopup" class="telegram-popup">
  <h2><i class="fab fa-telegram"></i> Join Telegram Channel</h2>
  <p>Join our Telegram channel to get Live Match Links and Cricket Updates instantly.</p>
  <a href="https://t.me/+rwZKMV0-L8wyOTll" target="_blank" class="popup-button join-btn">Join Channel</a>
  <button onclick="closePopup()" class="popup-button joined-btn">Continue Watching</button>
</div>

<script>
  async function initializePlayer() {
    const video = document.getElementById('video');
    const queryParams = new URLSearchParams(window.location.search);
    const streamUrl = queryParams.get('url');

    if (!streamUrl) {
        console.error("URL parameter is missing!");
        return;
    }

    const player = new shaka.Player(video);
    const container = document.querySelector('.shaka-video-container');
    const ui = new shaka.ui.Overlay(player, container, video);

    const config = {
      'seekBarColors': { base: 'rgba(255,255,255,.2)', buffered: 'rgba(255,255,255,.4)', played: 'rgb(255,0,0)' },
      'controlPanelElements': ['play_pause', 'mute', 'time_and_duration', 'spacer', 'quality', 'fullscreen', 'overflow_menu']
    };
    ui.configure(config);

    try {
      await player.load(streamUrl);
      console.log('Stream loaded!');
    } catch (e) {
      console.error('Error loading stream', e);
    }
  }

  function showTelegramPopup() {
    if (!localStorage.getItem("tgJoined")) {
      setTimeout(() => {
        document.getElementById("telegramPopup").style.display = "block";
        document.getElementById("video").pause();
      }, 5000);
    }
  }

  function closePopup() {
    document.getElementById("telegramPopup").style.display = "none";
    localStorage.setItem("tgJoined", "true");
    document.getElementById("video").play();
  }

  document.addEventListener('shaka-ui-loaded', initializePlayer);
  window.addEventListener("load", showTelegramPopup);
</script>
</body>
</html>
