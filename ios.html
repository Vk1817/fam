<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>CRICKCAST · Fancode Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
  <script src="https://pl31467926.profitableratecpmnetwork.com/4e/25/e4/4e25e45556a54a50d1c66d2d232b2c61.js"></script>
  <style>
    :root {
      --bg: #0b0e1a;
      --surface: #111827;
      --surface2: #1a2235;
      --border: rgba(255,255,255,0.07);
      --text: #f0f4ff;
      --muted: #6b7280;
      --accent: #3b82f6;
      --accent2: #6366f1;
      --live: #ef4444;
      --upcoming: #f59e0b;
      --watch-btn: #3b6cf8;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; min-height:100%; background:var(--bg);
      font-family:'Inter',system-ui,sans-serif; color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#2d3748; border-radius:4px; }

    #overlay {
      position:fixed; inset:0; background:var(--bg); z-index:9999;
      display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
    }
    #overlay svg { animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #overlay p { color:var(--muted); font-size:13px; font-weight:500; }

    #status {
      position:fixed; top:max(14px,env(safe-area-inset-top)); right:max(14px,env(safe-area-inset-right));
      z-index:9997; padding:6px 14px; background:rgba(11,14,26,.92);
      border:1px solid rgba(255,255,255,.08); font-size:11px; font-weight:600;
      border-radius:20px; pointer-events:none; opacity:0; transition:opacity .3s;
      backdrop-filter:blur(8px); color:var(--accent);
    }
    #status.show { opacity:1; }
    #status.warn { color:var(--upcoming); }
    #status.err  { color:var(--live); }

    #app-header {
      position:sticky; top:0; z-index:100;
      background:rgba(11,14,26,.85); backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      padding:0 24px;
    }
    #header-inner {
      max-width:1320px; margin:0 auto;
      display:flex; align-items:center; justify-content:space-between;
      height:64px; gap:16px;
    }
    .logo-wrap { display:flex; align-items:center; gap:10px; }
    .logo-icon {
      width:36px; height:36px; border-radius:10px;
      background:linear-gradient(135deg,#3b82f6,#6366f1);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0;
    }
    .logo-text { font-size:18px; font-weight:900; letter-spacing:-.5px; color:#fff; }
    .logo-sub { font-size:10px; font-weight:500; color:var(--muted); letter-spacing:.5px; margin-left:2px; }
    #theme-toggle {
      display:flex; align-items:center; gap:7px; padding:7px 14px;
      background:var(--surface2); border:1px solid var(--border); border-radius:10px;
      color:var(--muted); font-size:12px; font-weight:500; cursor:pointer;
      font-family:inherit; transition:all .2s;
    }
    #theme-toggle:hover { border-color:var(--accent); color:var(--text); }

    #channel-list { display:none; min-height:100vh; }
    #channel-list.visible { display:block; }

    #content-wrap { max-width:1320px; margin:0 auto; padding:28px 24px 48px; }

    .section-head { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
    .live-dot {
      width:8px; height:8px; border-radius:50%; background:var(--live);
      animation:pulse 1.2s ease-in-out infinite; flex-shrink:0;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.85)} }
    .section-label {
      font-size:11px; font-weight:700; letter-spacing:1.5px;
      text-transform:uppercase; color:var(--muted);
    }
    .section-count {
      font-size:11px; font-weight:700; color:var(--live);
      background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.2);
      padding:2px 9px; border-radius:20px;
    }

    #category-filter {
      display:flex; gap:8px; margin-bottom:28px;
      overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    #category-filter::-webkit-scrollbar { display:none; }
    .filter-pill {
      flex-shrink:0; padding:7px 18px; border-radius:24px;
      font-size:11px; font-weight:600; letter-spacing:.3px;
      text-transform:uppercase; cursor:pointer; white-space:nowrap;
      background:var(--surface); color:var(--muted);
      border:1px solid var(--border); transition:all .2s; font-family:inherit;
    }
    .filter-pill:hover { border-color:var(--accent); color:var(--text); }
    .filter-pill.active {
      background:linear-gradient(135deg,#3b82f6,#6366f1);
      color:#fff; border-color:transparent;
      box-shadow:0 4px 16px rgba(59,130,246,.3);
    }

    .ad-slot {
      width:100%; min-height:60px; margin:0 0 24px;
      display:flex; align-items:center; justify-content:center;
      background:var(--surface); border:1px dashed var(--border);
      border-radius:12px; overflow:hidden; padding:10px;
    }
    .ad-slot:empty { display:none; }

    #ch-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
      gap:20px;
    }

    .ch-card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:16px; overflow:hidden;
      cursor:pointer; text-decoration:none; color:inherit;
      display:flex; flex-direction:column;
      transition:transform .25s, box-shadow .25s, border-color .25s;
      -webkit-tap-highlight-color:transparent;
    }
    .ch-card:hover {
      transform:translateY(-4px);
      box-shadow:0 12px 40px rgba(0,0,0,.5);
      border-color:rgba(59,130,246,.35);
    }
    .ch-card:active { transform:scale(.98); }

    .card-thumb {
      position:relative; width:100%; aspect-ratio:16/9;
      overflow:hidden; background:#0d111f;
      display:flex; align-items:center; justify-content:center;
    }
    .card-thumb img {
      width:100%; height:100%; object-fit:cover;
      transition:transform .35s;
    }
    .card-thumb img.logo-fit {
      object-fit:contain; padding:24px; background:#0d111f;
    }
    .ch-card:hover .card-thumb img { transform:scale(1.04); }

    .card-thumb .thumb-placeholder {
      width:100%; height:100%;
      background:linear-gradient(135deg,#111827,#1e2a45);
      display:flex; align-items:center; justify-content:center;
      font-size:48px; font-weight:900; letter-spacing:2px;
      color:rgba(59,130,246,.35);
    }

    .badge-live {
      position:absolute; top:12px; left:12px;
      display:inline-flex; align-items:center; gap:5px;
      padding:4px 10px; border-radius:8px;
      background:rgba(239,68,68,.9); backdrop-filter:blur(6px);
      font-size:10px; font-weight:700; letter-spacing:.8px;
      text-transform:uppercase; color:#fff;
    }
    .badge-live::before {
      content:''; width:6px; height:6px; border-radius:50%;
      background:#fff; animation:pulse 1.2s ease-in-out infinite;
    }
    .badge-cat {
      position:absolute; top:12px; right:12px;
      padding:4px 10px; border-radius:8px;
      background:rgba(11,14,26,.7); backdrop-filter:blur(6px);
      border:1px solid rgba(255,255,255,.1);
      font-size:9px; font-weight:600; letter-spacing:.8px;
      text-transform:uppercase; color:rgba(255,255,255,.7);
    }

    .card-body {
      padding:16px 18px 18px; display:flex; flex-direction:column; gap:12px;
      flex:1;
    }
    .card-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .meta-event {
      font-size:10px; font-weight:600; letter-spacing:.5px;
      text-transform:uppercase; color:var(--muted);
    }

    .card-title {
      font-size:15px; font-weight:700; line-height:1.4; color:var(--text);
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .card-info { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .info-chip {
      display:inline-flex; align-items:center; gap:5px;
      font-size:10px; font-weight:500; color:var(--muted);
    }
    .info-chip svg { width:12px; height:12px; opacity:.6; flex-shrink:0; }

    .watch-btn {
      display:flex; align-items:center; justify-content:center; gap:8px;
      padding:11px 0; border-radius:10px;
      background:linear-gradient(135deg,#3b6cf8,#5b4cf8);
      color:#fff; font-size:13px; font-weight:700; letter-spacing:.3px;
      border:none; cursor:pointer; font-family:inherit;
      transition:filter .2s, transform .15s;
      -webkit-tap-highlight-color:transparent;
      margin-top:auto;
    }
    .watch-btn:hover { filter:brightness(1.12); }
    .watch-btn:active { transform:scale(.97); }
    .watch-btn svg { width:16px; height:16px; }

    #empty-state {
      display:none; text-align:center; padding:80px 24px;
    }
    #empty-state p { color:var(--muted); font-size:14px; }

    #player-container {
      position:fixed; inset:0; background:#000; z-index:9997;
      display:none; align-items:center; justify-content:center;
    }
    #player-container video { width:100%; height:100%; object-fit:contain; }
    .plyr { height:100%; width:100%; background:#000; }
    .plyr__controls { background:linear-gradient(0,rgba(0,0,0,.9),transparent)!important; }
    .plyr__control--overlaid { background:linear-gradient(135deg,#3b82f6,#6366f1)!important; }
    .plyr__progress__played { background:linear-gradient(90deg,#3b82f6,#6366f1)!important; }

    #ad-container {
      position:absolute; inset:0; z-index:5;
      background:#000; display:none; overflow:hidden;
    }
    #ad-container.active { display:block; }
    #ad-container video, #ad-container iframe { width:100%; height:100%; }

    .player-toolbar {
      position:fixed; top:max(14px,env(safe-area-inset-top));
      left:max(14px,env(safe-area-inset-left)); z-index:9998;
      display:none; align-items:center; gap:8px;
    }
    .player-toolbar.show { display:flex; }
    .back-btn {
      padding:7px 14px; background:rgba(11,14,26,.85);
      border:1px solid rgba(255,255,255,.1); border-radius:10px; color:#fff;
      font-size:11px; font-weight:600; cursor:pointer; text-decoration:none;
      display:inline-flex; align-items:center; gap:6px;
      backdrop-filter:blur(10px); font-family:inherit; transition:all .2s;
    }
    .back-btn:hover { border-color:var(--accent); }
    .back-btn svg { width:14px; height:14px; }

    /* ════════════════════════════════════════════
       FLOATING SOCIAL BADGES — top-left corner (player only)
    ════════════════════════════════════════════ */
    #socialBadges{
      position:fixed;
      top:max(58px, calc(env(safe-area-inset-top) + 58px));
      left:max(14px, env(safe-area-inset-left));
      z-index:10000;
      display:none;
      flex-direction:column;
      gap:6px;
    }
    #socialBadges.show{display:flex}

    .soc-badge{
      display:flex;
      align-items:center;
      gap:6px;
      padding:5px 11px 5px 6px;
      border-radius:12px;
      text-decoration:none;
      color:#fff;
      font-family:'Inter',system-ui,sans-serif;
      font-weight:700;
      font-size:12px;
      letter-spacing:.3px;
      border:1px solid rgba(255,255,255,.15);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      transition:transform .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .soc-badge:hover{transform:translateY(-2px)}
    .soc-badge:active{transform:scale(.96)}

    .tg-badge{
      background:linear-gradient(135deg,#2AABEE 0%,#229ED9 55%,#1c7fc4 100%);
      box-shadow:0 8px 22px rgba(42,171,238,.4);
    }
    .tg-badge:hover{ box-shadow:0 12px 30px rgba(42,171,238,.6); }

    .wa-badge{
      background:linear-gradient(135deg,#25d366 0%,#128c7e 100%);
      box-shadow:0 8px 22px rgba(37,211,102,.4);
    }
    .wa-badge:hover{ box-shadow:0 12px 30px rgba(37,211,102,.6); }

    .soc-badge svg{
      width:16px;
      height:16px;
      flex-shrink:0;
      fill:#fff;
      filter:drop-shadow(0 1px 3px rgba(0,0,0,.25));
    }
    .soc-badge span{white-space:nowrap}

    @media (max-width:640px){
      #content-wrap { padding:20px 16px 40px; }
      #ch-grid { grid-template-columns:1fr; gap:14px; }
      #header-inner { padding:0; }
      #app-header { padding:0 16px; }

      /* collapse social badges to circles on phones */
      .soc-badge{
        padding:0;
        width:40px;
        height:40px;
        justify-content:center;
        border-radius:50%;
        gap:0;
      }
      .soc-badge span{display:none}
      .soc-badge svg{width:18px;height:18px}
      #socialBadges{
        top:max(56px, calc(env(safe-area-inset-top) + 56px));
      }
    }
    @media (min-width:641px) and (max-width:1024px) {
      #ch-grid { grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
    }

    body.light {
      --bg:#f0f4f8; --surface:#ffffff; --surface2:#e8edf3;
      --border:rgba(0,0,0,.08); --text:#0f172a; --muted:#64748b;
    }
    body.light #app-header { background:rgba(240,244,248,.9); }
    body.light .card-thumb .thumb-placeholder {
      background:linear-gradient(135deg,#e2e8f0,#cbd5e1);
      color:rgba(59,130,246,.35);
    }
    body.light .badge-cat { background:rgba(255,255,255,.85); color:#374151; }

    /* ════════════════════════════════════════════
       TELEGRAM POPUP
    ════════════════════════════════════════════ */
    #tgOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      padding: 20px;
      animation: fadeInPopup 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    #tgOverlay.show { display: flex; }

    #tgCard {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(160deg, #121821, #0a0c0f);
      border: 1px solid rgba(79, 195, 247, 0.15);
      border-radius: 24px;
      padding: 36px 28px 28px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(79, 195, 247, 0.03);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    #tgCard::before {
      content: "";
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(79, 195, 247, 0.04), transparent 60%);
      pointer-events: none;
    }
    #tgIcon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2AABEE, #229ED9);
      box-shadow: 0 0 40px rgba(42, 171, 238, 0.2);
      position: relative;
      z-index: 1;
    }
    #tgIcon svg { width: 36px; height: 36px; }

    #tgCard h2 {
      margin: 0 0 8px;
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
      font-weight: 700;
      color: #ffffff;
      font-family: 'Inter', system-ui, sans-serif;
      position: relative;
      z-index: 1;
      letter-spacing: -0.01em;
    }
    #tgCard p {
      margin: 0 0 24px;
      color: #8e9baf;
      font-size: clamp(0.9rem, 1.2vw, 1.05rem);
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }
    .tgBtns { display: flex; gap: 12px; position: relative; z-index: 1; }
    .tgBtn {
      flex: 1;
      height: 48px;
      border-radius: 40px;
      font-weight: 700;
      font-size: clamp(0.85rem, 1vw, 1rem);
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.01em;
    }
    #joinNow {
      background: linear-gradient(135deg, #4fc3f7, #2196f3);
      color: #ffffff;
      box-shadow: 0 6px 24px rgba(79, 195, 247, 0.25);
    }
    #joinNow:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(79, 195, 247, 0.35);
    }
    #joinedBtn {
      background: rgba(255, 255, 255, 0.05);
      color: #8e9baf;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    #joinedBtn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    @keyframes fadeInPopup {
      from { opacity: 0; transform: scale(0.95) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @media (max-width: 480px) {
      #tgCard { padding: 24px 18px 20px; border-radius: 20px; }
      #tgIcon { width: 60px; height: 60px; }
      #tgIcon svg { width: 30px; height: 30px; }
      #tgCard h2 { font-size: 1.2rem; }
      #tgCard p { font-size: 0.85rem; margin-bottom: 18px; }
      .tgBtn { height: 42px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<!-- OVERLAY -->
<div id="overlay">
  <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="16" stroke="#1e2a45" stroke-width="4"/>
    <path d="M20 4a16 16 0 0 1 16 16" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <p id="loadMsg">Loading channels…</p>
</div>

<!-- STATUS -->
<div id="status"></div>

<!-- PLAYER TOOLBAR -->
<div class="player-toolbar" id="playerToolbar">
  <button class="back-btn" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Back
  </button>
</div>

<!-- HEADER -->
<header id="app-header">
  <div id="header-inner">
    <div class="logo-wrap">
      <div class="logo-icon">⚡</div>
      <div>
        <div class="logo-text">CRICKCAST</div>
        <div class="logo-sub">Fancode · Sayan</div>
      </div>
    </div>
    <button id="theme-toggle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      Light Mode
    </button>
  </div>
</header>

<!-- CHANNEL LIST -->
<div id="channel-list">
  <div id="content-wrap">

    <div class="ad-slot" id="ad-slot-top">
      <!-- PASTE YOUR BANNER AD HERE -->
    </div>

    <div id="live-section-head" class="section-head" style="display:none;">
      <span class="live-dot"></span>
      <span class="section-label">Live Now</span>
      <span class="section-count" id="live-count">0</span>
    </div>

    <div id="category-filter"></div>

    <div id="ch-grid"></div>
    <div id="empty-state"><p>No channels found in this category.</p></div>

    <div class="ad-slot" id="ad-slot-bottom" style="margin-top:24px;">
      <!-- PASTE YOUR BANNER AD HERE -->
    </div>
  </div>
</div>

<!-- PLAYER -->
<div id="player-container">
  <div id="ad-container"></div>
  <video id="player" playsinline webkit-playsinline controls preload="metadata"></video>
</div>

<!-- ════════════════════════════════════════════
     FLOATING SOCIAL BADGES (outside player-container so
     resetPlayerDom() can't wipe them out)
════════════════════════════════════════════ -->
<div id="socialBadges">
  <a class="soc-badge tg-badge" href="https://t.me/CRICKCAST18" target="_blank" rel="noopener" title="CRICKCAST on Telegram">

<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════════════════════════
   AD CONFIGURATION
   ═══════════════════════════════════════════════════════════════ */
var VAST_TAG   = "";        // ← paste your VAST tag URL, or leave "" to disable
var AD_TIMEOUT = 8000;

/* ═══ SOURCE ═══ */
var M3U_URL    = "https://raw.githubusercontent.com/drmlive/fancode-live-events/refs/heads/main/fancode.m3u";
var PROXY_BASE = "https://sportlink-fancode10.pages.dev/api/proxy?u=";

/* ═══ DOM ═══ */
var $overlay   = document.getElementById("overlay");
var $loadMsg   = document.getElementById("loadMsg");
var $status    = document.getElementById("status");
var $list      = document.getElementById("channel-list");
var $grid      = document.getElementById("ch-grid");
var $filter    = document.getElementById("category-filter");
var $pCont     = document.getElementById("player-container");
var $video     = document.getElementById("player");
var $backBtn   = document.getElementById("backBtn");
var $toolbar   = document.getElementById("playerToolbar");
var $themeBtn  = document.getElementById("theme-toggle");
var $liveHead  = document.getElementById("live-section-head");
var $liveCount = document.getElementById("live-count");
var $empty     = document.getElementById("empty-state");
var $socialBadges = document.getElementById("socialBadges");

var _stTmr = null;
var allChannels = [];
var currentCategory = 'All';
var currentHls = null;
var currentPlayer = null;
var resumeTmr = null;
var retryTmr = null;
var unmuteHandler = null;
var currentAdsLoader = null;
var currentAdsManager = null;

/* Session token — every play() increments it. Stale callbacks bail. */
var playToken = 0;

// ── HELPERS ──
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function getInitials(name){
  var w = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!w.length) return '?';
  return w.length === 1 ? w[0].substring(0,2).toUpperCase() : (w[0][0]+w[1][0]).toUpperCase();
}

// ── THEME ──
var isLight = false;
$themeBtn.addEventListener('click', function(){
  isLight = !isLight;
  document.body.classList.toggle('light', isLight);
  $themeBtn.innerHTML = isLight
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Dark Mode'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg> Light Mode';
});

// ── TOAST ──
function toast(msg, type, dur){
  $status.textContent = msg;
  $status.className = "show " + (type||"ok");
  if(_stTmr) clearTimeout(_stTmr);
  if(dur !== 0) _stTmr = setTimeout(function(){ $status.className = ""; _stTmr = null; }, dur||4000);
}
function setMsg(m){ if($loadMsg) $loadMsg.textContent = m; }
function hideOverlay(){ if($overlay) $overlay.style.display = "none"; }
function getChId(){ return new URLSearchParams(location.search).get("id") || ""; }

// ── PROXY ──
function proxyUrl(url){
  if(!url) return url;
  if(url.indexOf(PROXY_BASE) === 0) return url;
  return PROXY_BASE + encodeURIComponent(url);
}

// ── PARSE M3U ──
function parseM3U(text){
  var channels=[], lines=text.split(/\r?\n/), cur=null;
  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;

    if(line.indexOf('#EXTINF:') === 0){
      var info = line.substring(8);
      var ci = info.indexOf(',');
      var attrs = ci>=0 ? info.substring(0,ci) : info;
      var name  = ci>=0 ? info.substring(ci+1).trim() : 'Unknown';

      if(/(?:^|\s)(tvg-logo|group-title|tvg-id|tvg-name)=/i.test(name)){
        var lq = info.lastIndexOf('"');
        if(lq >= 0){
          var af = info.substring(lq+1);
          var rc = af.indexOf(',');
          if(rc >= 0){
            var ae = lq + 1 + rc;
            attrs = info.substring(0, ae).trim().replace(/^[,\s]+/,'');
            name  = info.substring(ae+1).trim();
          }
        }
      }

      var id='', logo='', group='General';
      var idM = attrs.match(/tvg-id="([^"]*)"/i); if(idM) id = idM[1];
      var lgM = attrs.match(/tvg-logo="([^"]*)"/i); if(lgM) logo = lgM[1];
      var grM = attrs.match(/group-title="([^"]*)"/i); if(grM) group = grM[1] || 'General';

      name = name.replace(/^[,\s]+/,'').replace(/^"+|"+$/g,'').trim() || 'Unknown';
      var sid = id || (name.replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'_'+channels.length);
      cur = { id:sid, name:name, logo:logo, category:group, stream_url:'' };

    } else if(line.charAt(0) === '#'){
      if(line.indexOf('#EXTGRP:') === 0 && cur){
        var g = line.substring(8).trim();
        if(g) cur.category = g;
      }
      continue;

    } else if(cur){
      cur.stream_url = line;
      channels.push(cur);
      cur = null;
    }
  }
  return channels;
}

// ── LOAD ──
async function loadData(){
  var r = await fetch(proxyUrl(M3U_URL), {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  var text = await r.text();
  var ch = parseM3U(text).filter(function(c){ return c.stream_url; });
  if(!ch.length) throw new Error("No channels found");
  return ch;
}

// ── FILTERS ──
function renderFilters(channels){
  var seen = {}, cats = ['All'];
  channels.forEach(function(c){
    if(c.category && c.category !== 'General') seen[c.category] = true;
  });
  Object.keys(seen).sort().forEach(function(c){ cats.push(c); });

  var f = document.createDocumentFragment();
  cats.forEach(function(cat){
    var pill = document.createElement('button');
    pill.className = 'filter-pill' + (cat === currentCategory ? ' active' : '');
    pill.textContent = cat;
    pill.dataset.category = cat;
    pill.addEventListener('click', function(){
      currentCategory = cat;
      document.querySelectorAll('.filter-pill').forEach(function(p){
        p.classList.toggle('active', p.dataset.category === cat);
      });
      renderChannels(channels);
    });
    f.appendChild(pill);
  });
  $filter.innerHTML = '';
  $filter.appendChild(f);
}

// ── CARDS ──
function renderChannels(channels){
  var filtered = currentCategory === 'All' ? channels
    : channels.filter(function(ch){ return ch.category === currentCategory; });

  var liveCount = filtered.length;
  if(liveCount > 0){
    $liveHead.style.display = 'flex';
    $liveCount.textContent = liveCount;
  } else {
    $liveHead.style.display = 'none';
  }

  $empty.style.display = filtered.length ? 'none' : 'block';
  $grid.innerHTML = '';
  if(!filtered.length) return;

  var f = document.createDocumentFragment();
  filtered.forEach(function(ch){
    var playable = !!(ch.stream_url && ch.stream_url.length);
    var card = document.createElement('div');
    card.className = 'ch-card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', ch.name);

    var catBadge = (ch.category && ch.category !== 'General')
      ? '<span class="badge-cat">' + esc(ch.category) + '</span>' : '';

    var init = getInitials(ch.name);
    var thumbInner = ch.logo && ch.logo.trim()
      ? '<img class="logo-fit" src="' + esc(ch.logo) + '" alt="' + esc(ch.name) + '" loading="lazy" ' +
        'onerror="this.onerror=null;this.outerHTML=\'<div class=&quot;thumb-placeholder&quot;>'+init+'</div>\'">'
      : '<div class="thumb-placeholder">' + init + '</div>';

    var catChip = ch.category
      ? '<span class="info-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>' + esc(ch.category.toUpperCase()) + '</span>' : '';

    var eventLine = ch.category && ch.category !== 'General'
      ? '<span class="meta-event">' + esc(ch.category.toUpperCase()) + '</span>' : '';

    var btnLabel = playable
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Watch Live'
      : 'Not Available';

    card.innerHTML =
      '<div class="card-thumb">' + thumbInner +
        (playable ? '<span class="badge-live">LIVE</span>' : '') +
        catBadge +
      '</div>' +
      '<div class="card-body">' +
        (eventLine ? '<div class="card-meta">' + eventLine + '</div>' : '') +
        '<div class="card-title">' + esc(ch.name) + '</div>' +
        (catChip ? '<div class="card-info">' + catChip + '</div>' : '') +
        '<button class="watch-btn"' + (playable ? '' : ' disabled') + '>' + btnLabel + '</button>' +
      '</div>';

    if(playable){
      function play(e){
        e.preventDefault();
        if(window.history && window.history.pushState)
          window.history.pushState({}, '', '?id=' + encodeURIComponent(ch.id));
        document.title = 'CRICKCAST · ' + ch.name;
        setupHLSPlayer(ch.stream_url, ch.name);
      }
      card.addEventListener('click', play);
      card.addEventListener('keydown', function(e){
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); play(e); }
      });
    } else {
      card.addEventListener('click', function(){ toast('Stream not available','warn',3000); });
    }

    f.appendChild(card);
  });
  $grid.appendChild(f);
}

// ── RENDER LIST ──
function renderList(channels){
  hideOverlay();
  allChannels = channels;
  renderFilters(allChannels);
  renderChannels(allChannels);
  $list.classList.add('visible');
}

// ── PLAYER SHOW/HIDE ──
function showPlayer(){
  $list.classList.remove('visible');
  $pCont.style.display = 'flex';
  $toolbar.classList.add('show');

  /* Show floating social badges on the player */
  if($socialBadges) $socialBadges.classList.add('show');

  /* Trigger the Telegram popup once per session */
  if (typeof window.showTelegramPopup === 'function') {
    window.showTelegramPopup();
  }
}

/* Replace <video> + #ad-container entirely between sessions.
   Plyr + Hls.js + IMA all leave stale state otherwise. */
function resetPlayerDom(){
  try {
    $pCont.innerHTML =
      '<div id="ad-container"></div>' +
      '<video id="player" playsinline webkit-playsinline controls preload="metadata"></video>';
    $video = document.getElementById('player');
  } catch(e){}
}

function destroyPlayer(){
  if(retryTmr){ clearTimeout(retryTmr); retryTmr = null; }
  if(resumeTmr){ clearInterval(resumeTmr); resumeTmr = null; }

  if(currentAdsManager){ try{ currentAdsManager.destroy(); }catch(e){} currentAdsManager = null; }
  if(currentAdsLoader){ try{ currentAdsLoader.destroy(); }catch(e){} currentAdsLoader = null; }
  if(currentPlayer){ try{ currentPlayer.destroy(); }catch(e){} currentPlayer = null; }
  if(currentHls){ try{ currentHls.destroy(); }catch(e){} currentHls = null; }

  resetPlayerDom();

  if(unmuteHandler){
    document.removeEventListener('click', unmuteHandler);
    document.removeEventListener('touchstart', unmuteHandler);
    unmuteHandler = null;
  }
}

function hidePlayer(){
  playToken++;
  $pCont.style.display = 'none';
  $toolbar.classList.remove('show');
  $list.classList.add('visible');

  /* Hide floating social badges */
  if($socialBadges) $socialBadges.classList.remove('show');

  destroyPlayer();

  if(window.history && window.history.pushState)
    window.history.pushState({}, document.title, window.location.pathname);
  document.title = 'CRICKCAST · Fancode Live';
}

/* ═══ AD PLAYBACK ═══ */
function playAdThenContent(url, name, token){
  var canRequest = VAST_TAG && window.google && google.ima && google.ima.AdsLoader;
  if(!canRequest){ startStream(url, token); return; }

  var adContainer = document.getElementById('ad-container');
  if(!adContainer){ startStream(url, token); return; }

  adContainer.classList.add('active');
  toast('Advertisement','warn',0);

  var done = false;
  var adTimer = null;

  function finish(){
    if(done) return;
    done = true;
    if(adTimer){ clearTimeout(adTimer); adTimer = null; }

    if(currentAdsManager){ try{ currentAdsManager.destroy(); }catch(e){} currentAdsManager = null; }
    if(currentAdsLoader){ try{ currentAdsLoader.destroy(); }catch(e){} currentAdsLoader = null; }

    var ac = document.getElementById('ad-container');
    if(ac){ ac.classList.remove('active'); try{ ac.innerHTML = ''; }catch(e){} }

    if(token !== playToken) return;
    startStream(url, token);
  }

  try {
    var displayContainer = new google.ima.AdDisplayContainer(adContainer, $video);
    displayContainer.initialize();

    var adsLoader = new google.ima.AdsLoader(displayContainer);
    currentAdsLoader = adsLoader;

    adsLoader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED, function(e){
      if(done || token !== playToken){ finish(); return; }
      try {
        var mgr = e.getAdsManager($video, null);
        currentAdsManager = mgr;
        mgr.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, finish);
        mgr.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, finish);
        mgr.addEventListener(google.ima.AdEvent.Type.CONTENT_RESUME_REQUESTED, finish);
        mgr.addEventListener(google.ima.AdEvent.Type.SKIPPED, finish);
        mgr.init(window.innerWidth, window.innerHeight, google.ima.ViewMode.NORMAL);
        mgr.start();
      } catch(err){ finish(); }
    }, false);

    adsLoader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, finish, false);

    var req = new google.ima.AdsRequest();
    req.adTagUrl = VAST_TAG;
    req.linearAdSlotWidth  = window.innerWidth;
    req.linearAdSlotHeight = window.innerHeight;
    req.nonLinearAdSlotWidth  = window.innerWidth;
    req.nonLinearAdSlotHeight = Math.round(window.innerHeight * 0.2);

    adsLoader.requestAds(req);
  } catch(e){ finish(); return; }

  adTimer = setTimeout(finish, AD_TIMEOUT);
}

/* ═══ HLS STREAM ═══ */
function startStream(url, token){
  if(token !== playToken) return;

  var playUrl = proxyUrl(url);
  var opts = {
    controls:['play','progress','current-time','mute','volume','captions','settings','fullscreen'],
    settings:['quality'], autoplay:true, muted:true
  };
  var isM3U8 = /\.m3u8(\?|$)/i.test(url) || url.indexOf('.m3u8') !== -1;

  function startPlayback(){
    if(token !== playToken) return;
    if(!currentPlayer){
      try { currentPlayer = new Plyr($video, opts); } catch(e){}
    }
    var p = $video.play();
    if(p && p.catch) p.catch(function(){});
    hideOverlay();
    toast('● Live','ok',3000);
  }

  function attachUnmute(){
    if(unmuteHandler){
      document.removeEventListener('click', unmuteHandler);
      document.removeEventListener('touchstart', unmuteHandler);
    }
    unmuteHandler = function(){
      try { $video.muted = false; $video.volume = 1; } catch(e){}
      document.removeEventListener('click', unmuteHandler);
      document.removeEventListener('touchstart', unmuteHandler);
      unmuteHandler = null;
    };
    document.addEventListener('click', unmuteHandler);
    document.addEventListener('touchstart', unmuteHandler);
  }

  if(Hls.isSupported() && isM3U8){
    var hls = new Hls({
      autoStartLoad:true, enableWorker:true, lowLatencyMode:true,
      backbufferLength:30, manifestLoadingTimeOut:20000, manifestLoadingMaxRetry:6,
      levelLoadingTimeOut:20000, fragLoadingTimeOut:30000
    });
    currentHls = hls;

    hls.loadSource(playUrl);
    hls.attachMedia($video);

    hls.on(Hls.Events.MANIFEST_PARSED, function(_, data){
      if(token !== playToken) return;

      var qs = data.levels.map(function(l){ return l.height; })
        .filter(Boolean)
        .sort(function(a,b){ return b-a; })
        .filter(function(v,i,a){ return a.indexOf(v)===i; });

      var plyrOpts = Object.assign({}, opts);
      if(qs.length){
        plyrOpts.quality = {
          default: qs[0],
          options: qs,
          forced: true,
          onChange: function(q){
            hls.levels.forEach(function(lv, idx){
              if(lv.height === q) hls.currentLevel = idx;
            });
          }
        };
      }
      try { currentPlayer = new Plyr($video, plyrOpts); } catch(e){}

      var p = $video.play();
      if(p && p.catch) p.catch(function(){});
      hideOverlay();
      toast('● Live','ok',3000);
    });

    hls.on(Hls.Events.ERROR, function(_, data){
      if(token !== playToken) return;
      if(!data.fatal) return;

      toast('Reconnecting…','warn',0);
      if(retryTmr) clearTimeout(retryTmr);
      retryTmr = setTimeout(function(){
        retryTmr = null;
        if(token !== playToken) return;
        try {
          if(data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          else { destroyPlayer(); setupHLSPlayer(url, ''); }
        } catch(e){
          destroyPlayer(); setupHLSPlayer(url, '');
        }
      }, 2000);
    });

  } else if($video.canPlayType('application/vnd.apple.mpegurl') && isM3U8){
    $video.src = playUrl;
    $video.addEventListener('loadedmetadata', function onM(){
      $video.removeEventListener('loadedmetadata', onM);
      if(token !== playToken) return;
      startPlayback();
    });

  } else {
    $video.src = playUrl;
    startPlayback();
  }

  attachUnmute();

  if(resumeTmr) clearInterval(resumeTmr);
  var myResumeTmr = setInterval(function(){
    if(token !== playToken){ clearInterval(myResumeTmr); return; }
    if($video.paused && $video.readyState > 2){
      var p = $video.play();
      if(p && p.catch) p.catch(function(){});
    }
  }, 3000);
  resumeTmr = myResumeTmr;
}

/* ═══ ENTRY POINT ═══ */
function setupHLSPlayer(url, name){
  var token = ++playToken;

  showPlayer();
  destroyPlayer();
  toast('Loading…','warn',0);

  playAdThenContent(url, name, token);
}

// ── ERROR ──
function errMsg(msg){
  setMsg(msg);
  $overlay.style.display = 'flex';
  toast(msg, 'err', 0);
}

// ── EVENTS ──
$backBtn.addEventListener('click', hidePlayer);
window.addEventListener('popstate', function(){
  if($pCont.style.display === 'flex') hidePlayer();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && $pCont.style.display === 'flex') hidePlayer();
});

// ── MAIN ──
async function main(){
  var id = getChId();
  var channels;
  try {
    setMsg('Loading channels…');
    channels = await loadData();
  } catch(e){
    console.error(e);
    errMsg('Connection error.');
    return;
  }
  if(!id){ renderList(channels); return; }
  var ch = channels.find(function(c){ return c.id === id; });
  if(!ch){ errMsg('Channel not found.'); return; }
  document.title = 'CRICKCAST · ' + ch.name;
  renderList(channels);
  setupHLSPlayer(ch.stream_url, ch.name);
}

document.addEventListener('DOMContentLoaded', main);
})();
</script>

  function markSeen() {

  }

  function alreadySeen() {
    try { return sessionStorage.getItem('tgPopupSeen') === '1'; } catch (e) { return false; }

  /* Exposed globally — the player calls this when it opens */
  window.showTelegramPopup = function () {

    setTimeout(function () {
      tgOverlay.classList.add('show');
    }, 3000);
  };

  document.getElementById('joinNow').onclick = function () {
    markSeen();
    window.open('https://t.me/CRICKCAST18', '_blank');
    closePopup();
  };

  document.getElementById('joinedBtn').onclick = function () {
    markSeen();
    closePopup();
  };

  tgOverlay.addEventListener('click', function (e) {
    if (e.target === tgOverlay) {
      closePopup();
    }
  });

  document.addEventListener('keydown', function (e) {
